<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard — Site</title>
<link rel="manifest" href="admin.webmanifest">
<meta name="theme-color" content="#161616">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/admin.css">
<script>if(localStorage.getItem("admin-theme")==="dark")document.documentElement.classList.add("dark")</script>
</head>
<body>

<div class="login" id="login" hidden>
  <div class="login__box">
    <button class="btn theme-toggle login__theme" type="button" aria-label="Alternar modo claro/escuro" data-theme-btn>◐</button>
    <h1>Dashboard</h1>
    <p id="loginMsg">Entra com a tua conta Google para editar o site.</p>
    <button class="btn btn--primary" id="btnGoogle" type="button">Entrar com Google</button>
    <button class="btn" id="btnLoginOut" type="button" hidden>Sair e trocar de conta</button>
    <p class="login__err" id="loginErr"></p>
  </div>
</div>

<header class="bar">
  <strong class="bar__title">Dashboard</strong>
  <span class="badge" id="badge">…</span>
  <span class="bar__sp"></span>
  <span class="bar__state" id="state"></span>
  <button class="btn" id="btnImport" title="Carregar um content.json">Importar</button>
  <button class="btn" id="btnReset" title="Descartar rascunho e voltar ao publicado">Repor</button>
  <button class="btn" id="btnExport" title="Descarregar content.json">Exportar</button>
  <button class="btn btn--primary" id="btnPublish">Publicar</button>
  <button class="btn theme-toggle" id="btnTheme" data-theme-btn type="button" aria-label="Alternar modo claro/escuro" title="Claro / escuro">◐</button>
  <button class="btn" id="btnLogout" hidden>Sair</button>
  <input type="file" id="fileImport" accept="application/json" hidden>
</header>

<div class="app">
  <nav class="side" id="side"></nav>
  <main class="editor" id="editor"></main>
  <aside class="preview" id="previewPane">
    <div class="preview__bar">
      <select id="pvPage"></select>
      <button class="btn btn--sm is-on" data-dev="desktop">Desktop</button>
      <button class="btn btn--sm" data-dev="mobile">Telemóvel</button>
      <button class="btn btn--sm" id="pvReload">↻</button>
    </div>
    <div class="preview__stage"><iframe id="pv" name="folio-preview" title="Pré-visualização"></iframe></div>
  </aside>
</div>

<div class="toast" id="toast" role="status"></div>

<script>document.querySelectorAll("[data-theme-btn]").forEach(b=>b.addEventListener("click",()=>{const d=document.documentElement.classList.toggle("dark");try{localStorage.setItem("admin-theme",d?"dark":"light")}catch(e){}}))</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("admin-sw.js",{scope:"admin.html"}).catch(()=>{}))</script>
<script src="firebase-config.js"></script>
<script src="js/admin.js" type="module"></script>
</body>
</html>
